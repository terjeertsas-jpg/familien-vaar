<style>
:root{
  --bg:#f1e6db;
  --bg2:#ebe0d4;
  --card:#fffaf5;
  --card2:#fffdf9;
  --ink:#2a1f1c;
  --muted:#816c64;
  --rose:#7a3e45;
  --rose-soft:#f3e2dc;
  --line:rgba(42,31,28,.07);
  --line-strong:rgba(42,31,28,.11);
  --shadow:0 1px 0 rgba(42,31,28,.02),0 12px 32px rgba(42,31,28,.05);
  --shadow-lg:0 2px 0 rgba(42,31,28,.02),0 22px 52px rgba(42,31,28,.07);
  --radius:22px;
  --radius-sm:16px;
  --space-1:6px;
  --space-2:10px;
  --space-3:16px;
  --space-4:20px;
  --space-5:28px;
  --space-6:40px;
  --max:700px;
  --tap:44px;
  --focus:0 0 0 3px rgba(122,62,69,.14);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100dvh;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  color:var(--ink);
  font-family:"Source Sans 3",system-ui,sans-serif;
  font-size:16.5px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1000px 420px at 10% -6%,rgba(247,235,227,.7) 0%,transparent 58%),
    radial-gradient(820px 380px at 100% 2%,rgba(232,213,198,.45) 0%,transparent 52%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
}
button,input,select,textarea{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,.tabbar button{cursor:pointer}
a{color:var(--rose);text-decoration-thickness:1px;text-underline-offset:2px}
.wrap{max-width:var(--max);margin:0 auto;padding:var(--space-5) 20px calc(var(--space-6) + 12px)}
header.app{
  display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-3);
  margin:4px 0 var(--space-5);
  padding-top:2px;
}
.brand{
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--rose);font-weight:600;opacity:.92;
}
.weekbig{
  font-family:Fraunces,Georgia,serif;
  font-size:clamp(34px,8.8vw,46px);font-weight:500;
  margin:10px 0 8px;line-height:1.08;letter-spacing:-.03em;
  color:var(--ink);
}
.sub{color:var(--muted);font-size:15px;line-height:1.5;max-width:36em}
.section-label{
  display:block;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  color:var(--muted);margin:0 0 var(--space-2);opacity:.9;
}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.pill{
  background:rgba(255,250,245,.88);
  border:1px solid var(--line);
  border-radius:999px;
  padding:9px 15px;
  font-size:13px;
  color:var(--muted);
  font-weight:500;
  transition:background .15s ease,color .15s ease,border-color .15s ease,box-shadow .15s ease;
}
button.pill{cursor:pointer}
button.pill:focus-visible{
  outline:none;
  box-shadow:var(--focus);
  border-color:rgba(122,62,69,.28);
}
.card{
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:var(--space-4) var(--space-4) var(--space-4);
  margin:0 0 var(--space-4);
  box-shadow:var(--shadow);
}
.card+.card{margin-top:0}
.card h3{
  font-family:Fraunces,Georgia,serif;
  font-weight:500;
  margin:0 0 12px;
  font-size:19px;
  letter-spacing:-.015em;
  line-height:1.28;
}
.card p{margin:0 0 14px;line-height:1.6}
.card p:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch}
.grid2>.stat,.grid2>.card{min-width:0;height:100%;margin:0}
.eq{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:stretch}
.eq>.card{margin:0;height:100%}
nav.tabbar{
  /* Solid bg: backdrop-filter + fixed scrolls with page on iOS Safari */
  position:fixed !important;left:0 !important;right:0 !important;bottom:0 !important;
  width:100%;max-width:100vw;margin:0;z-index:100;
  background:#fffaf5;
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(7,1fr);
  padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -6px 24px rgba(42,31,28,.05);
  -webkit-transform:translateZ(0);
  transform:translateZ(0);
}
nav.tabbar button{
  background:0;border:0;color:#9a837a;
  min-height:var(--tap);
  padding:6px 2px 4px;
  font-size:10px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;
  border-radius:14px;
  transition:color .15s ease;
}
nav.tabbar button.on{color:var(--rose)}
nav.tabbar button:focus-visible{
  outline:none;
  box-shadow:inset 0 0 0 2px rgba(122,62,69,.2);
}
.icon{
  display:grid;place-items:center;
  width:32px;height:32px;margin:0 auto 4px;
  border-radius:11px;font-size:14px;
  transition:background .15s ease,box-shadow .15s ease;
}
nav.tabbar button.on .icon{
  background:var(--rose-soft);
  box-shadow:inset 0 0 0 1px rgba(122,62,69,.14);
}
.btn,.btn2{
  border:0;border-radius:999px;
  padding:12px 20px;cursor:pointer;
  font-weight:600;font-size:14px;
  min-height:44px;
  transition:transform .12s ease,opacity .12s ease,background .15s ease,box-shadow .15s ease;
}
.btn:active,.btn2:active{transform:scale(.98)}
.btn:focus-visible,.btn2:focus-visible{outline:none;box-shadow:var(--focus)}
.btn{background:var(--rose);color:#fffaf4;box-shadow:0 1px 0 rgba(42,31,28,.05)}
.btn2{background:#efe2d6;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{display:block;font-size:12px;color:var(--muted);margin:16px 0 7px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
input,select,textarea{
  width:100%;
  border:1px solid var(--line-strong);
  background:#fff;
  border-radius:var(--radius-sm);
  padding:13px 15px;
  line-height:1.45;
  transition:border-color .15s ease,box-shadow .15s ease;
}
input:focus,select:focus,textarea:focus,
input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:none;
  border-color:rgba(122,62,69,.32);
  box-shadow:var(--focus);
}
input[type=checkbox],input[type=radio]{
  width:auto;min-width:20px;height:20px;margin:3px 0 0;flex-shrink:0;
  accent-color:var(--rose,#c4785a);
}
ul.clean li span,.chk span{
  flex:1;min-width:0;
  text-transform:none;letter-spacing:0;font-weight:400;
  color:inherit;font-size:15px;line-height:1.55;
}
.chk,label:has(>input[type=checkbox]){
  display:flex;align-items:flex-start;gap:12px;
  margin:10px 0;
  padding:2px 0;
  text-transform:none;letter-spacing:0;font-weight:400;
  font-size:15px;color:inherit;
}
textarea{min-height:100px;resize:vertical}
ul.clean{list-style:none;padding:0;margin:0}
ul.clean li{
  display:flex;gap:12px;align-items:flex-start;
  padding:14px 0;
  border-bottom:1px solid var(--line);
}
ul.clean li:last-child{border-bottom:0;padding-bottom:2px}
ul.clean li:first-child{padding-top:4px}
.moods{display:flex;gap:8px;font-size:24px;flex-wrap:wrap}
.moods button{background:#f4e8dc;border:0;border-radius:16px;padding:10px 12px;min-height:44px;min-width:44px;cursor:pointer;transition:background .15s ease,box-shadow .15s ease}
.moods button:focus-visible{outline:none;box-shadow:var(--focus)}
.moods button.on{background:var(--rose-soft);box-shadow:inset 0 0 0 1.5px var(--rose)}
.tiny{font-size:13px;color:var(--muted);line-height:1.55}
.stat{
  padding:var(--space-3) var(--space-4);
  background:rgba(255,250,245,.78);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  box-shadow:0 1px 0 rgba(42,31,28,.015);
}
.stat b{display:block;font-family:Fraunces,Georgia,serif;font-size:26px;font-weight:500;letter-spacing:-.02em;margin-bottom:4px}
.warn{font-size:13px;color:var(--muted);line-height:1.55;margin:var(--space-3) 0 0}
.kick{font-family:Fraunces,Georgia,serif;font-size:56px;text-align:center;font-weight:500;letter-spacing:-.03em}
.hidden{display:none!important}
.hero-warm{
  margin:0 0 var(--space-4);
  padding:16px 18px;
  border-radius:var(--radius-sm);
  background:linear-gradient(135deg,rgba(243,226,220,.85),rgba(255,250,245,.96));
  border:1px solid rgba(122,62,69,.09);
  color:var(--ink);
  font-size:15px;
  line-height:1.55;
  box-shadow:0 1px 0 rgba(42,31,28,.02);
}
.setup-lead{margin:0 0 var(--space-2);color:var(--muted);font-size:15px;line-height:1.55}
@media print{
  nav.tabbar,nav{display:none!important}
  body{padding:0;background:#fff}
  .wrap{max-width:none}
  .card{break-inside:avoid;box-shadow:none}
}

.micro-k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:14px 0 5px}

.mem-thumb{

.photo-modal{

}
.photo-modal img{max-width:min(960px,100%);max-height:90vh;border-radius:18px;box-shadow:var(--shadow-lg);cursor:default}
.mem-row{display:flex;gap:14px;align-items:flex-start}
.mem-row .mem-body{flex:1;min-width:0}

<script>
(function(){
  function zapNetlifyHud(){
    var sel='#nf-hud,#netlify-hud,netlify-hud,[data-nf-variant],[data-netlify-hud],iframe[src*="hud"],iframe[src*="netlify.new"],iframe[src*="app.netlify.com"],script[src*="netlify/scripts/hud"]';
    document.querySelectorAll(sel).forEach(function(n){
      try{
        if(n.tagName==='SCRIPT'){n.type='text/plain';n.removeAttribute('src'); n.remove();}
        else {n.remove();}
      }catch(e){}
    });
    var body=document.body; if(!body) return;
    Array.prototype.forEach.call(body.children,function(el){
      if(!el||el.id==='app'||(el.classList&&(el.classList.contains('tabbar')||el.classList.contains('wrap')))||el.tagName==='SCRIPT'||el.tagName==='STYLE'||el.tagName==='NAV')return;
      try{
        var st=window.getComputedStyle(el);
        if(st.position!=='fixed'&&st.position!=='sticky')return;
        var zi=parseInt(st.zIndex||'0',10);
        var r=el.getBoundingClientRect();
        var covers=(r.width>=window.innerWidth*0.5 && r.height>=window.innerHeight*0.3) || zi>=999;
        if(covers){el.style.setProperty('pointer-events','none','important'); el.style.setProperty('display','none','important');}
      }catch(e){}
    });
  }
  zapNetlifyHud();
  document.addEventListener('DOMContentLoaded',zapNetlifyHud);
  setTimeout(zapNetlifyHud,0);
  setTimeout(zapNetlifyHud,500);
  setTimeout(zapNetlifyHud,2000);
  try{
    new MutationObserver(zapNetlifyHud).observe(document.documentElement,{childList:true,subtree:true});
  }catch(e){}
})();
</script>

<script>
(function(){
  var nav=document.querySelector('nav.tabbar');
  if(!nav) return;
  function pin(){
    try{
      var vv=window.visualViewport;
      if(!vv){ nav.style.bottom='0px'; return; }
      /* Keep bar at visual bottom; avoid mid-screen stuck after keyboard */
      var gap=Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      nav.style.bottom=gap+'px';
    }catch(e){ nav.style.bottom='0px'; }
  }
  pin();
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',pin);
    window.visualViewport.addEventListener('scroll',pin);
  }
  window.addEventListener('resize',pin);
  window.addEventListener('orientationchange',function(){ setTimeout(pin,300); });
})();
</script>

<script>

const SIZE_ET=new Set(["valmuefrø","sesamfrø","blåbær","bringebær","eple","blomkålhode","salathode","kålhode","gresskar"]);

const WEEKS={
4:{baby:'Embryoet er i sin aller tidligste fase: cellene deler seg raskt og danner en liten celleklump som snart fester seg. Hode og kropp er ennå ikke tydelige — det som skjer nå, er grunnlaget for alt som kommer. Du merker ofte ingenting, og det er helt vanlig.',vanlig:'Mange merker ingenting ennå — og det er helt vanlig. Noen kjenner bare ømme bryster, litt tretthet eller en anelse av «annet enn vanlig». Humøret kan være mer følsomt uten at du kan peke på hvorfor. En graviditetstest kan fortsatt være negativ så tidlig, så usikkerhet hører til fasen.',forvent:'Mensen kan utebli. Hvis du ikke allerede tar folat, er det lurt å starte med 400 mikrogram daglig nå. Hold tempoet rolig: du trenger ikke fortelle noen før du selv vil.',humor:'Usikkerhet hører til denne fasen. Det er greit å vente med store konklusjoner til testen og de neste ukene gir mer klarhet.',partner:'Kjøp folat i kveld, og hold kalenderen myk uten å spekulere høyt om hva som skjer.',kjop:'Kjøp folat. Babyutstyr kan vente — det løser ingen problemer nå.',kurs:'Ingen kurs haster ennå. Ro og informasjon holder i denne fasen.',bok:'Ingenting haster å lese. Når nysgjerrigheten kommer, er Helsenorge et godt sted å starte.'},
5:{baby:'Embryoet er fortsatt bittelite, men hjerterøret begynner å slå, og nevralrøret — starten på hjerne og ryggmarg — er i arbeid. Det er en av grunnene til at folat er ekstra viktig nå. Kroppen jobber stille og intensivt, lenge før magen synes.',vanlig:'Ømme bryster, tretthet og mer sensitiv lukt er vanlig. Noen merker fortsatt ingenting, og begge deler er helt innenfor. Lukt av kaffe, matlaging eller parfyme kan plutselig bli for mye. Små humørsvingninger og tårer uten «grunn» er også typisk når hormonene rører på seg.',forvent:'Kvalme kan starte de neste ukene. Du kan booke første time hos fastlege eller jordmor når det passer. Fortsett med folat, og la dagen få flere pauser hvis kroppen ber om det.',humor:'Humøret kan svinge uten at du «burde være lykkelig». Hormonene jobber hardt, og det merkes.',partner:'Ta over kveldsoppvasken uten kommentar, og tilby å bli med på første time hvis hun vil ha deg der.',kjop:'Fortsett med folat, og vurder en multi med D-vitamin. Løse topper er mer nyttig enn babyklær nå.',kurs:'Les Helsenorges sider om kosthold i ro. Det slår et tilfeldig forum.',bok:'En kort innføring i norsk svangerskapsomsorg — ni kontroller og tilbud om to ultralyd — gir oversikt uten stress.'},
6:{baby:'Embryoet får tydeligere hode og kropp, og hjerteanlegget formes videre. Små arm- og beinknopper begynner å komme til syne som myke knopper langs sidene. Alt er fortsatt svært lite, men proporsjonene begynner å minne om en C-formet embryofigur.',vanlig:'Kvalme, tretthet, hyppig vannlating og økt spytt er vanlig hos mange. Noen slipper unna med lite, og det er også vanlig. Matlyst kan forsvinne midt i et måltid, eller komme i bølger. Du kan føle deg «influensa-trøtt» uten feber — kroppen jobber hardt i det stille.',forvent:'Matlukt kan bli vanskelig. Små og hyppige måltider hjelper ofte mer enn store tallerkener. Ha nøytral mat tilgjengelig, og dropp presset om «perfekt kost» denne uken.',humor:'Irritasjon og tårer uten «grunn» er biologi, ikke en karakterbrist. Det går an å være snill med seg selv i denne perioden.',partner:'Handle inn nøytral mat hun tåler i kveld, og unngå å spørre om hun har «prøvd ingefær» flere ganger.',kjop:'Kjeks og en vannflaske er praktisk. Mattilsynet fraråder ingefærshots og ingefærtilskudd — hold deg unna dem.',kurs:'Begynn å tenke på fødselsforberedende kurs og spedbarns førstehjelp, men du trenger ikke melde deg på ennå.',bok:'Velg én jordmor-bok og én ærlig barselbok når du er klar. To bøker er nok.'},
7:{baby:'Hjernen og ansiktstrekkene utvikles raskt i denne embryonale uken. Navlestrengen transporterer næring, og organanlegg fortsetter å ta form. Hodet er fortsatt stort i forhold til kroppen — en typisk embryo-proporsjon du kan se i skjematiske illustrasjoner.',vanlig:'Kvalmen er på topp for mange nå. Metallsmak, økt spytt og å være trøtt allerede klokken 20 er vanlig. Brystene kan være ømme, og du kan kjenne deg oppblåst eller oppstemt og irritert i samme time. Det er biologi — ikke dårlig «gravid-stil».',forvent:'Si ifra på jobb når du vil. Du har rett til fri med lønn til kontroll når det ikke kan time utenom arbeidstid. Planlegg korte hvilepunkter i kalenderen hvis dagene kjennes lange.',humor:'Skyldfølelse for å være «dårlig gravid» er vanlig — og unyttig. Kroppen din gjør allerede en stor jobb.',partner:'Kutt sosiale planer hun ikke orker i kveld, og gjør det uten å gjøre det til en diskusjon.',kjop:'Kjøp det som løser et problem dere har nå. Se listen under Lister for konkrete forslag.',kurs:'Fødselsforberedende og spedbarns førstehjelp kan planlegges, men tidspunktet er mer aktuelt senere.',bok:'Én jordmor-bok og én ærlig barselbok er fortsatt nok. Les når energien er der.'},
8:{baby:'Embryoet har tydeligere ansiktstrekk, og fingre og tær begynner å skilles fra hverandre. Små spontanbevegelser kan starte, men du kjenner dem vanligvis ikke ennå. Kroppen er fortsatt C-krummet, med stort hode og korte lemmer som bare er i knoppstadiet.',vanlig:'Kvalme, BH som strammer og mer utflod er vanlig i denne uken. Mange merker også hodepine, svimmelhet når de reiser seg fort, eller at lukter blir overveldende. Humøret kan svinge mellom håp og uro — særlig før første kontroll. Begge følelsene får plass, og det er greit å være sliten av dem.',forvent:'På første kontroll måles blodtrykk, urin og blodprøver, ofte med ferritin. Ta gjerne med spørsmålene dine skriftlig. Skriv ned det som sies — hodet husker dårlig når det er mye nytt.',humor:'Angst for abort er vanlig i første trimester. Del den med noen du stoler på, i stedet for å google alene klokken to om natten.',partner:'Bli med på første time hvis hun vil, og skriv ned det jordmor eller legen sier.',kjop:'En mappe til papirer er nyttig. Barnevogn kan vente lenge ennå.',kurs:'Fødselsforberedende og spedbarns førstehjelp står fortsatt på lista for senere.',bok:'Én jordmor-bok og én ærlig barselbok holder. Ikke fyll hylla for tidlig.'},
9:{baby:'Organene er på plass som anlegg og skal modnes videre. Den embryonale «halen» er borte, og formen blir mer fosterlik. Hodet er fortsatt stort i forhold til kroppen, mens arm- og beinknopper blir litt mer synlige uke for uke.',vanlig:'Trettheten kan være tung, nesten som å gå i vann. Noen får hodepine eller trykk i pannen — drikk væske og hvil, men kontakt helsevesenet ved sterk, plutselig hodepine. Ømme bryster, mer utflod og at klær i livet kjennes strammere uten synlig mage er vanlig. Du kan også merke mer tårevåthet eller irritasjon enn du «forventet».',forvent:'Klær i livet kan bli trange uten at magen synes særlig ennå. Det er en vanlig overraskelse. Bytt til løsere midje når det trengs — komfort er nok begrunnelse.',humor:'Du kan være glad og redd i samme time. Begge følelsene får plass.',partner:'Lag en middag i kveld som hun faktisk får ned, uten å kommentere porsjonsstørrelsen.',kjop:'Kjøp det som løser et problem nå. Se Lister når dere er usikre på hva som faktisk trengs.',kurs:'Fødselsforberedende og spedbarns førstehjelp kan ventes med til senere i svangerskapet.',bok:'Én jordmor-bok og én ærlig barselbok er fortsatt et godt utgangspunkt.'},
10:{baby:'Fra rundt nå kalles embryoet ofte foster. De viktigste organene er anlagt og skal vokse og modnes videre. Lemmene er korte stubber, hodet er fortsatt relativt stort, og fosteret ligger gjerne krøllet — en rolig, skjematisk «miniatyr» av det som kommer.',vanlig:'Kvalme kan fortsatt styre dagen. Noen får mer energi i korte glimt, mens andre fortsatt er svært trøtte. Oppblåsthet, forstoppelse, metallsmak og at du blir andpusten i trapper er vanlige kroppslige tegn. Følelsen av å være «gravid på innsiden» uten å se det utenpå kan være merkelig — og vanlig.',forvent:'Tenk gjennom hvem som skal få vite om graviditeten, og når. Det er lov å vente. En kort liste over hvem som får vite først, kan dempe stresset.',humor:'Å sammenligne deg med andres «strålende første trimester» ødelegger mer enn det hjelper. Din kropp har sitt eget tempo.',partner:'Ikke publiser noe om graviditeten uten at hun har sagt klart ja først.',kjop:'Kjøp det som løser et problem dere har nå. Store babykjøp kan vente.',kurs:'Fødselsforberedende og spedbarns førstehjelp kommer nærmere, men haster ikke denne uken.',bok:'Én jordmor-bok og én ærlig barselbok er nok. Les kapittelvis når spørsmål dukker opp.'},
11:{baby:'Fosteret strekker og bøyer seg mer aktivt, selv om du sjelden kjenner det ennå. Ansiktet blir gradvis mer menneskelig, og korte lemmer blir tydeligere stubber. Hjertet banker stødig, og nervesystemet fortsetter å koble seg sammen.',vanlig:'Blodvolumet øker. Tannkjøttet kan blø lettere når du pusser tennene, og det er vanlig. Mange merker mer spytt, tett nese, eller at de blir varme og rødmer lettere. Tretthet og kvalme kan fortsatt henge i — du er ikke «bakpå» hvis energien ikke er tilbake ennå.',forvent:'Helsenorge har intervaller for vektøkning ut fra KMI. Målet er ikke å slanke seg, og heller ikke å «spise for to». Spis når du orker, i porsjoner som kroppen tåler.',humor:'Kroppsendring uten synlig «babylook» kan føles merkelig. Du er ikke alene om den følelsen.',partner:'Gi et kompliment som handler om utholdenhet i kveld — ikke om mage eller utseende.',kjop:'Ny BH er en god investering hvis bøylene graver. Det gjør hverdagen mer behagelig med en gang.',kurs:'Fødselsforberedende og spedbarns førstehjelp kan planlegges når energien tillater det.',bok:'Én jordmor-bok og én ærlig barselbok holder fortsatt.'},
12:{baby:'De fleste organer er anlagt og vokser videre i et jevnt tempo. Risikoen for tidlig tap synker for mange rundt her, men ingen kan love garanti — det er greit å puste litt lettere uten å kreve visshet. Fosteret er fortsatt lite, med stort hode og korte lemmer.',vanlig:'Kvalmen letter ofte rundt her, men ikke alltid — noen trenger flere uker. Energi kan komme tilbake i små doser. Brystene kan fortsatt være ømme, og midjen «mykere». Lettelse og antiklimaks kan komme samtidig når du nærmer deg slutten av første trimester.',forvent:'Folattilskudd anbefales til og med uke 12. Deretter er mat og eventuelt multi etter jordmors råd det vanlige. Se kommunens fødselsforberedende kurs nå — plassene fylles ofte tidlig.',humor:'Lettelse og antiklimaks kan komme samtidig. Begge deler er lovlige reaksjoner.',partner:'Feire stille hvis hun vil — ikke ballonger eller stor stand hvis hun ikke har bedt om det.',kjop:'Barnevogn trengs ikke ennå. Spar plassen og pengene til dere kjenner behovet bedre.',kurs:'Se kommunens fødselsforberedende kurs nå — plassene fylles ofte tidlig.',bok:'Én jordmor-bok og én ærlig barselbok er fortsatt et godt valg.'},
13:{baby:'Andre trimester starter, og fosteret fortsetter å vokse jevnt. Skjelettet forbeines gradvis, og lemmer og kropp får litt mer lengde. Hodet er fortsatt relativt stort, men proporsjonene begynner sakte å ligne mer på et lite foster enn et tidlig embryo.',vanlig:'Magen kan begynne å synes, eller bare «føles annerledes» under klærne. Libido kan endre seg begge veier, og begge deler er vanlig. Noen merker mindre kvalme og mer matlyst. Andre får fortsatt tretthet, hodepine eller ømhet i bekkenet når de går. Humøret svinger fortsatt — det er greit.',forvent:'Løse klær blir mer aktuelle. Fortell familie hvis det er planen deres nå. Én god gravidbukse eller elastisk midje slår fem «morsomme» t-skjorter.',humor:'Presset om å være «endelig glad» er sludder. Humøret svinger fortsatt, og det er greit.',partner:'Ta bilder bare hvis hun ber om det — ikke fordi bestemor har spurt.',kjop:'Løse bukser eller én god gravidbukse slår fem «morsomme» t-skjorter.',kurs:'Fødselsforberedende og spedbarns førstehjelp bør på meldingslista snart hvis dere ikke allerede har sjekket.',bok:'Én jordmor-bok og én ærlig barselbok er fortsatt nok.'},
14:{baby:'Ansiktet kan ha mimikk, og tynne hårstrå (lanugo) kan komme. Skjelettet styrkes, og fosteret øver fortsatt på å bevege armer og bein inne i fostervannet. Du kjenner det kanskje ikke ennå — det er helt vanlig i denne fasen.',vanlig:'Økt utflod, tett nese («gravid-nese») og mer spytt er vanlig hos noen i denne fasen. Ryggen kan begynne å kjennes, særlig etter å ha stått lenge. Du kan også merke strekkfølelse i sidene når livmoren vokser — ofte kortvarig og ufarlig, men si fra ved sterke smerter.',forvent:'Ryggen kan begynne å kjennes. Sko med høy hæl er sjelden en god idé nå. Bytt mellom sittende og stående gjennom dagen når du kan.',humor:'Du kan savne den gamle kroppen og like den nye samtidig. Det er ikke en motsetning.',partner:'Gi en ryggmassasje i kveld uten å «fikse» holdningen hennes underveis.',kjop:'Kjøp det som løser et problem nå. Se Lister for konkrete forslag til denne fasen.',kurs:'Fødselsforberedende og spedbarns førstehjelp er gode å ha på kalenderen.',bok:'Én jordmor-bok og én ærlig barselbok holder. Les det som føles relevant nå.'},
15:{baby:'Ørene nærmer seg sin plass, og beinmargen utvikles videre. Fosteret blir mer komplett uke for uke: hjerte, nyrer og nervesystem jobber i bakgrunnen mens kroppen vokser. Bevegelsene blir mer rytmiske, selv om de ofte fortsatt er umerkelige for deg.',vanlig:'Appetitten kan øke. Halsbrann kan starte tidlig hos noen, også før magen er stor. Noen merker kramper i legger, mer tørste, eller at de blir andpusten i bakker. Følelsen av «rundere midje» uten store spark ennå er vanlig — kroppen er foran det du kjenner.',forvent:'Små, hyppige måltider hjelper ofte. Unngå å ligge flatt rett etter mat hvis halsbrannen er plagsom. Ha noe nøytralt å spise tilgjengelig når sulten treffer brått.',humor:'Matlyst og kvalme kan bytte på time for time. Kroppen er ikke alltid konsekvent.',partner:'Ha surt, salt og nøytralt i huset i kveld — og kommenter ikke porsjonene.',kjop:'Kjøp det som løser et problem dere har nå. Store innkjøp kan fortsatt vente.',kurs:'Fødselsforberedende og spedbarns førstehjelp bør snart påmeldingsvurderes.',bok:'Én jordmor-bok og én ærlig barselbok er fortsatt et godt utgangspunkt.'},
16:{baby:'Noen kjenner tidlige spark nå, særlig hvis de har vært gravide før; førstegangsfødende kjenner ofte bevegelse senere. Muskler og skjelett styrkes, og fosteret øver på å svelge fostervann. Det er trening for fordøyelse og lunger — ikke tørst.',vanlig:'Livet blir rundere. Bekkenet kan gi småsting eller «stølhet» når du snur deg i sengen, og det er vanlig uten at det betyr alarm. Noen kjenner tidlige bobler eller flutter — andre merker fortsatt ingenting. Begge deler er innenfor. Søvn kan bli lettere forstyrret av vannlating eller varme.',forvent:'Venstre sideleie hjelper ofte søvnen. En pute mellom knærne kan gjøre en merkbar forskjell. Noter gjerne når du eventuelt kjenner bevegelse — uten å jage etter det.',humor:'Uvirkelig-følelse er vanlig til sparkene kommer. Det er greit å vente på beviset kroppen gir.',partner:'Legg hånden på magen når hun sier det er aktivitet — ikke krev et show.',kjop:'En gravidpute er verdt det hvis søvnen faktisk er ødelagt. Ellers kan den vente.',kurs:'Fødselsforberedende og spedbarns førstehjelp: sjekk ledige plasser i kommunen.',bok:'Én jordmor-bok og én ærlig barselbok holder fortsatt.'},
17:{baby:'Et tynt fettlag begynner å bygges, og skjelettet blir sterkere. Fosteret fortsetter å øve på bevegelser: strekk, spark og tommel-i-munn kan forekomme. Sansene er underveis, og kroppens proporsjoner blir litt mer babyaktige uke for uke.',vanlig:'Strekkmerker kan komme på mage, bryst eller lår. De handler om arv og tøying — ikke om moral eller innsats. Hudkløe, tett nese og at BH og bukser strammer mer er vanlig. Energinivået er ofte bedre enn i første trimester, men dagsformen kan fortsatt svinge hardt.',forvent:'Hudpleie er komfort. Den gir ingen garanti mot strekkmerker, men kan føles godt. Velg klær som ikke graver i huden — det merkes gjennom hele dagen.',humor:'Speilet kan bli en fiende noen dager. Det er tillatt å ikke elske hvert bilde.',partner:'Ikke si «du er jo nesten ikke gravid» i kveld — det treffer sjelden godt.',kjop:'Kjøp det som løser et problem nå. Se Lister for forslag som faktisk er nyttige.',kurs:'Fødselsforberedende og spedbarns førstehjelp bør være påmeldt snart hvis plassene fylles.',bok:'Én jordmor-bok og én ærlig barselbok er fortsatt nok.'},
18:{baby:'Offentlig ultralyd-tilbud ligger typisk rundt her. Man ser blant annet på hjerte, lemmer og vekst — en trygg sjekk, ikke en fasit for alt. Fosteret har nå klarere armer og bein, fortsatt stort hode, og beveger seg aktivt i fostervannet.',vanlig:'Spark blir tydeligere for mange, særlig om kvelden. Ryggplager, strekk i lysken og at du blir fortere andpusten er også vanlig. Halsbrann og oppblåsthet kan følge med når magen vokser. Ultralyd-uken kan gi både glede og ekstra uro — begge reaksjoner er normale.',forvent:'Ta gjerne med partner til ultralyd. Be om bilder eller notater, og husk at én ultralyd ikke er all diagnostikk i verden. Skriv spørsmål på forhånd — det er lettere enn å huske dem i rommet.',humor:'Kjønnsgjetting og navnepress fra familie kan dempes med en tydelig grense. Dere bestemmer tempoet.',partner:'Kjør til ultralyden, husk spørsmålene, og si lite i rommet hvis hun vil styre samtalen.',kjop:'Kjøp det som løser et problem nå. Unngå impulskjøp rett etter ultralyden.',kurs:'Fødselsforberedende og spedbarns førstehjelp er aktuelle å booke rundt nå.',bok:'Én jordmor-bok og én ærlig barselbok holder. Ultralydbilder er minner, ikke lærebøker.'},
19:{baby:'Sansene utvikles videre: fosteret svelger fostervann og øver på reflekser. Huden er fortsatt tynn, og lanugo kan dekke kroppen. Bevegelsene får mer mønster — spark, rull og strekk — selv om du ikke alltid kjenner dem like tydelig.',vanlig:'Kramper i legger om natten er vanlig. Strekk forsiktig og drikk væske; si fra hvis det blir svært plagsomt. Mange merker mer utflod, varme i kroppen og at søvnen brytes oftere. Følelsen av at magen «strammer» når babyen beveger seg, er typisk — og ofte mer merkbar når du sitter stille.',forvent:'Hvis ferritin-svar anbefalte jerntilskudd fra uke 18–20, start etter jordmors tall — ikke på egen magefølelse. Ta jerntilskudd slik jordmor har forklart (ofte med C-vitamin, ikke sammen med kaffe/te).',humor:'Uro for at «noe er galt» mellom kontroller er vanlig. Det er greit å si det høyt.',partner:'Gå en tur sammen i kveld — som luft, ikke som treningsprogram.',kjop:'Jerntilskudd bare etter avtale med jordmor eller lege. Ikke start på sjangs.',kurs:'Fødselsforberedende og spedbarns førstehjelp bør være booket eller snart bookes.',bok:'Én jordmor-bok og én ærlig barselbok er fortsatt et godt valg.'},
20:{baby:'Dere er halvveis. Fosteret er omtrent håndflate-langt i mange skjematiske beskrivelser, og bevegelsene får mer mønster. Lungene og fordøyelsen øver videre, hodet er fortsatt relativt stort, og armer og bein er tydelige kapselformer i illustrasjoner.',vanlig:'Navlen kan flattere. Halsbrann, bekkenplager og at du våkner for å tisse er vanlig hos mange rundt nå. Spark og rull får mer mønster — noen dager mer, noen mindre. Tyngdefølelse i korsrygg og at sko blir trangere mot kveld er også typisk. Du er halvveis, og kroppen merker det.',forvent:'Lær barnets våkenperioder. Senere i svangerskapet betyr «mindre liv» at dere kontakter fødeavdelingen — ikke at dere venter på appen. Start gjerne en enkel sykehussekk-liste på papir, uten å fylle sekken ennå.',humor:'Halvveis kan føles både langt og kort samtidig. Begge følelsene er vanlige.',partner:'Bli med på kontroll hvis hun vil, og skriv ned vekt og blodtrykk hvis hun ønsker logg.',kjop:'Start sykehussekk-listen på papir. Du trenger ikke fylle sekken ennå.',kurs:'Meld dere på fødselsforberedende kurs nå hvis dere ikke allerede har gjort det.',bok:'En jordmor-bok om fødselsfaser er nyttig lesning i tiden som kommer.'},
21:{baby:'Øyenbryn kan utvikles, og bevegelsene blir mer koordinerte. Fosteret øver stadig mer på å svelge, sparkle og strekke seg. Fettlaget er fortsatt tynt, men kroppen får litt mer fylde, og søvn- og våkenperioder begynner å tegne seg.',vanlig:'Søvn kommer ofte i biter. Puter som en festning er et vanlig syn i sengen. Hevelse i føtter mot kveld, kramper i legger og at magen «strammer» etter mat er vanlig. Irritasjon på småting kan sitte løst — det er ofte søvn og hormoner, ikke at du har blitt «en annen».',forvent:'Permisjon: 49 uker med 100 prosent eller 59 uker med 80 prosent. Valget gjelder begge og låses når uttaket starter. Åpne NAV-sidene sammen snart — ikke la det bli «senere».',humor:'Irritasjon på partner for småting er vanlig. Si den konkrete tingen — ikke hele karakteren.',partner:'Åpne NAV-sidene sammen i kveld. Ikke si at dere fikser det «senere».',kjop:'Kjøp det som løser et problem nå. Store babykjøp kan fortsatt vente.',kurs:'Fødselsforberedende og spedbarns førstehjelp bør være på kalenderen.',bok:'Én jordmor-bok og én ærlig barselbok holder. NAV-sidene er «boken» for pengene.'},
22:{baby:'Lungene utvikler luftveier videre — en stille, viktig jobb. Overlevelse ved svært tidlig fødsel er sykehusstoff og ikke noe appen skal spekulere i; det vanlige er at fosteret fortsetter å vokse trygt inne. Hud og fettlag bygges gradvis opp.',vanlig:'Hevelse i beina mot kveld er vanlig; løft dem når du kan. Plutselig hevelse i ansikt eller hender sammen med hodepine: ring helsevesenet. Kortpust i trapper, halsbrann og at bekkenet klager når du snur deg i sengen er typisk. Humøret kan følge søvnkvaliteten mer enn «viljen».',forvent:'Sko kan bli trange. Nye, trange skinnsko er sjelden en god idé nå. Bytt til romsligere sko og korte pauser med beina opp når du kan.',humor:'Humøret styres mer av hormoner, søvn og kvalme enn av vilje. Logg hvordan det er — ikke døm deg selv for det.',partner:'Ta kveldsoppvask og kleskurv som standard i kveld, ikke som en heltedåd.',kjop:'Kjøp det som løser et problem nå. Se Lister for forslag som faktisk hjelper.',kurs:'Fødselsforberedende og spedbarns førstehjelp: sjekk at dere har plass.',bok:'Én jordmor-bok og én ærlig barselbok er fortsatt nok.'},
23:{baby:'Huden er fortsatt rynkete, og mer underhudsfett kommer etter hvert. Fosteret fortsetter å vokse, høre mer og bevege seg i rytmer. Lemmene blir lengre, magen litt mykere, og proporsjonene minner mer om et lite barn i fosterstilling.',vanlig:'Noen merker Braxton Hicks: uregelmessige, ofte smertefrie sammentrekninger som ikke øker. Ved tvil — kontakt fødeavdelingen. Rygg og bekken kan være mer ømme. Søvn kan bli lettere, og du kan kjenne sparker under ribbeina. Det er vanlig å være både mer «synlig gravid» og mer sliten av det.',forvent:'Si fra til tannlegen at du er gravid. Noen inngrep utsettes til etter fødselen. Book fødselsforberedende og spedbarns førstehjelp snart hvis plassene fylles.',humor:'Humøret styres mer av hormoner, søvn og dagsform enn av viljestyrke. Det er greit å bare registrere hvordan det er.',partner:'Bli med på ultralyd eller kontroll hvis det er aktuelt, og bær posene hjem.',kjop:'Kjøp det som løser et problem nå. Unngå å fylle huset «i tilfelle».',kurs:'Fødselsforberedende og spedbarns førstehjelp bør være booket snart.',bok:'Én jordmor-bok og én ærlig barselbok holder fortsatt.'},

28:{baby:'Tredje trimester er i gang. Øyne, fettlag og stadig mindre plass preger utviklingen. Fosteret ser mer babyaktig ut: rundere mage, lengre lemmer og et hode som fortsatt er stort, men bedre proporsjonert. Lungene øver videre på det som skal skje etter fødselen.',vanlig:'Braxton Hicks, hevelse, søvnløshet og halsbrann er vanlig hos mange nå. Trykk under ribbeina, hyppig do og at det blir vanskeligere å finne en god sovestilling er typisk. Utålmodighet kan starte tidlig — det er ikke et tegn på at noe er galt, bare at ventingen er ekte.',forvent:'Kontrollene blir tettere. Sparkemønsteret blir viktigere å kjenne. Øv bilveien til fødeavdelingen, sjekk at tanken er full, og rydd plass til vesken.',humor:'Utålmodighet starter tidlig for noen. Det er ikke et tegn på at noe er galt — bare at ventingen er ekte.',partner:'Øv bilveien til fødeavdelingen i kveld, sjekk at tanken er full, og rydd plass til vesken.',kjop:'To amme-BH hvis amming er planen. Bind kan vente til nærmere slutten.',kurs:'Fødselsforberedende og spedbarns førstehjelp bør være gjennomført snart.',bok:'Les om barsel: gjester, søvn og mat. Det er mer nyttig enn enda en fødselsroman.'},

30:{baby:'Hodet ligger oftere nedover hos mange. Lungene øver videre på det de skal gjøre etter fødselen, mens fett og muskulatur gir mer fylde. Bevegelsene blir mer «rull enn salto» — forventet når magen blir trangere.',vanlig:'Bekkenløsning kan gjøre gange vondt. Tilpass aktiviteten — du trenger ikke slutte helt. Halsbrann, hevelse og at du blir andpusten av små ting er vanlig. Bevegelsene i magen føles ofte mer som rull enn salto. Det er greit å være lei og spent i samme setning.',forvent:'Søk foreldrepenger i god tid. Fristen er senest fire uker før uttak. Partner bør søke egen del selv — du skal ikke være sekretær for fedrekvoten.',humor:'Humøret styres mer av søvn og kropp enn av vilje. Si hvordan det er, uten å pynte på det.',partner:'Søk din egen del av permisjonen selv i kveld. Mor skal ikke være sekretær for fedrekvoten.',kjop:'Kjøp det som løser et problem nå. Bilsete og sekk nærmer seg, men kan planlegges rolig.',kurs:'Fødselsforberedende og spedbarns førstehjelp bør være bak dere snart.',bok:'Én jordmor-bok og én ærlig barselbok holder. NAV er kilden for pengene.'},
31:{baby:'Mer underhudsfett kommer, og huden blir mindre rynkete. Fosteret ser mer «ferdig» ut i skjematiske bilder: rund mage, fylte lemmer og tydelig fosterkrøll. Immunstoffer overføres fortsatt, og hjernen folder seg mer.',vanlig:'Kløe på magen er vanlig. Intens kløe i håndflater eller fotsåler skal du si fra om — det kan være leverrelatert. Braxton Hicks, tyngde nedad og søvn i biter er typisk. Mange merker mer utflod og at magen «strammer» etter aktivitet. Si fra ved blødning, vannlignende lekkasje eller mindre liv.',forvent:'Skriv fødeønsker kort og praktisk. Det trenger ikke være en roman. Les dem sammen med partner, så begge vet hva som faktisk betyr noe.',humor:'Humøret svinger. Det er lov å være spent og lei i samme setning.',partner:'Les fødeønskene hennes i kveld, og vit hva som faktisk betyr noe for henne.',kjop:'Kjøp det som løser et problem nå. Se Lister før dere handler «komplett barnerom».',kurs:'Fødselsforberedende og spedbarns førstehjelp: siste sjanse for mange kursplasser.',bok:'Én jordmor-bok og én ærlig barselbok er fortsatt et godt valg.'},
32:{baby:'Plassen er trang. Bevegelse blir mer rull enn salto, og det er forventet. Lungene, hjernen og fettlaget jobber videre i bakgrunnen. Fosteret har ofte en klar favorittstilling, og du merker trykk og spark på ulike steder gjennom dagen.',vanlig:'Søvn kommer ofte i nitti-minuttersbiter. Hyppig do om natten er vanlig. Hevelse, halsbrann, bekkenømhet og at du våkner med vonde hofter er typisk. Humøret kan følge slitenheten — å gråte av tretthet er ikke en depresjonsdiagnose, men vedvarende mørke skal du si til jordmor.',forvent:'Lag seks til åtte middager i fryseren. Det er barsel-infrastruktur, ikke overproduksjon. Start sykehussekken rolig — bodyer i 50–56 i små mengder er nok til å begynne med.',humor:'Å gråte av slitenhet er ikke en depresjonsdiagnose. Vedvarende mørke skal du likevel si til jordmor.',partner:'Frys tre lapskauser eller tilsvarende i kveld. Det slår en vag «plan» om å fikse mat senere.',kjop:'Start sykehussekken. Bodyer i størrelse 50–56 i små mengder er nok til å begynne med.',kurs:'Fødselsforberedende og spedbarns førstehjelp bør være gjennomført.',bok:'Én jordmor-bok og én ærlig barselbok holder. Åpne barselkapitlene snart.'},
33:{baby:'Immunstoffer overføres fortsatt fra deg til fosteret. Hjernefolder øker, og lungene nærmer seg mer moden funksjon. Kroppen er fylt ut med fett, og lemmer og mage ser mykere og mer babyaktige ut enn tidligere i svangerskapet.',vanlig:'Bekkenplager, hevelse og leggkramper er vanlig i denne fasen. Trykk mot blæren, kortpust og at sparker føles kraftigere men mer «låst» er typisk. Du kan også merke mer varme og svette om natten. Små justeringer i tempo og sko hjelper ofte mer enn å «bite tennene sammen».',forvent:'Sjekk bilsete i *deres* bil. Mange oppdager at det ikke passer dagen før hjemreise. Installer det og les manualen før det haster.',humor:'Humøret svinger med søvn. Det er greit å være praktisk og emosjonell på samme tid.',partner:'Installer bilsetet i kveld og les manualen. Ikke si at dere fikser det «på vei hjem».',kjop:'Kjøp bilsete hvis dere skal hjem i bil. Prøv det før det haster.',kurs:'Fødselsforberedende og spedbarns førstehjelp: bekreft at dere har fått det med.',bok:'Én jordmor-bok og én ærlig barselbok er fortsatt nok.'},
34:{baby:'Lungene nærmer seg mer moden funksjon hos de fleste. Fosteret er stadig mer klar for livet utenfor, men fortsetter å vokse og lagre fett. Bevegelsene er kraftige, men plassen begrenser de store svingene — en god påminnelse om at slutten nærmer seg.',vanlig:'Utflod øker. Ved tvil om vannavgang versus vanlig utflod: ring fødeavdelingen. Braxton Hicks kan komme oftere. Tyngde i bekkenet, søvnmangel og at du blir rastløs er vanlig. Det er lov å være spent uten å late som alt er rolig.',forvent:'Pakk sekken ferdig nok til at dere kan dra på tjue minutter. Lag en ferdig «dra-nå»-liste på kjøleskapet — nøkler, papirer, ladere.',humor:'Humøret styres av søvn og venting. Det er lov å være spent uten å late som alt er rolig.',partner:'Lag en ferdig «dra-nå»-liste på kjøleskapet i kveld, så ingen leter etter nøkler og papirer.',kjop:'Kjøp det som mangler til sekken. Se Lister for en fornuftig sjekkliste.',kurs:'Repeter gjerne pust og stillinger fra fødselskurset — kort og rolig.',bok:'Én jordmor-bok og én ærlig barselbok holder. Les det praktiske om barsel.'},
35:{baby:'Nyre og lever modnes videre, og fettlaget øker. Fosteret forbereder seg på livet utenfor med jevn vekst og stadig mer «ferdige» proporsjoner. Trykk nedad er vanlig for deg, mens fosteret ofte ligger med hodet lavt og kroppen krøllet.',vanlig:'Trykk nedad er vanlig. Å gå som en and er biomekanikk — ikke klønetehet. Halsbrann, hevelse, hyppig do og at ribbeina får mindre «plass» er typisk. Noen merker mer energi i rykk; andre er bare slitne. Begge deler er innenfor så nær slutten.',forvent:'Vit hvor helsestasjonen er etter fødselen, og hvordan dere får time. Avklar hvem som passer dyr eller søsken, med navn og nummer ferdig skrevet.',humor:'Humøret svinger. Det er greit å lengte etter slutten uten å ønske bort det som skjer nå.',partner:'Avklar hvem som passer dyr eller søsken, med navn og nummer, ferdig skrevet i kveld.',kjop:'Kjøp det som mangler til sekk og hjemkomst. Se Lister før dere handler ekstra.',kurs:'Fødselsforberedende bør være bak dere. Kort repetisjon er nok.',bok:'Én jordmor-bok og én ærlig barselbok er fortsatt et godt valg.'},
36:{baby:'Hodet kan synke ned i bekkenet (fiksering) hos mange. Da puster du ofte lettere, men kjenner mer trykk på blæren. Fosteret har rund mage, fylte lemmer og lite plass — bevegelsene er tydelige, men mer trykk og rull enn store spark.',vanlig:'Slimpropp kan løsne dager eller uker før start. Det er ikke det samme som at fødselen er i gang. Mer trykk på blæren, uregelmessige rier, søvnmangel og at magen «strammer» er vanlig. Mange puster litt lettere hvis hodet synker ned, men kjenner mer trykk nedad. Si fra ved regelmessige rier som øker, vannavgang eller blødning.',forvent:'Kontrollene kommer oftere. Gruppe B-streptokokker tas hos noen etter lokale rutiner — spør hvis du er usikker. Sekken bør være ferdig. Ha bind hjemme til etterpå.',humor:'«Er det i dag?»-spørsmål fra alle fortjener ferdige, korte svar. Du skylder ingen live-oppdatering.',partner:'Du svarer familien i kveld. Hun slipper å være informasjonskanal for hele slekta.',kjop:'Sekken bør være ferdig. Ha bind hjemme til etterpå.',kurs:'Repeter pust og stillinger kort. Store kurs er vanligvis bak dere nå.',bok:'Én jordmor-bok og én ærlig barselbok holder. Hold Helsenorge for hånden ved tvil.'},
37:{baby:'Fullbåren nærmer seg. Fra uke 37 kalles det ofte termin-nært, selv om mange venter lenger. Lungene, hjernen og immunsystemet fortsetter å finpusse. Fosteret er i stor grad klar, men hver ekstra dag inne gir fortsatt rolig modning.',vanlig:'Uregelmessige rier og energi i rykk er vanlig. Hverdagen kan føles som venting. Tyngde, lite søvn, hevelse og at alt «kjennes klart» uten at noe skjer, er typisk. Tegn til start kan være regelmessige rier som øker, vannavgang eller blodtingert slim — ring ved tvil.',forvent:'Tegn til start kan være regelmessige rier som øker, vannavgang eller blodtingert slim. Ring ved tvil. Ha ferdige, korte svar til «er det i dag?»-spørsmål — du skylder ingen live-oppdatering.',humor:'Humøret svinger med søvn og forventning. Det er lov å være spent og lei samtidig.',partner:'Ikke film uten samtykke, og ikke inviter svigermor «i tilfelle» uten at det er avtalt.',kjop:'Kjøp bare det som mangler. Se Lister — resten kan vente til etter fødselen.',kurs:'Fødselsforberedende og spedbarns førstehjelp bør være gjennomført.',bok:'Én jordmor-bok og én ærlig barselbok er fortsatt nok. Ro slår mer lesing nå.'},
38:{baby:'Lungene er i praksis klare hos de fleste. Fosteret fortsetter å modnes fram til fødselen: litt mer fett, litt mer immunoverføring, litt mer hjerneutvikling. Plassen er trang, og bevegelsene skal fortsatt merkes — bare ofte som kraftige trykk.',vanlig:'Tyngde, lite søvn og rastløshet er vanlig. Dagene kan føles lange. Braxton Hicks, trykk i bekkenet og at du veksler mellom «i dag!» og «aldri» er typisk. Bevegelse skal fortsatt merkes — ofte som kraftige trykk mer enn store spark.',forvent:'Termin er et estimat. De fleste går ikke nøyaktig på dagen. Sjekk sekk, ladere og snacks — det er nok handling for de fleste kvelder nå.',humor:'Sinnssykt kjedelig venting er en fase, ikke et tegn på at noe er galt.',partner:'Vær hjemme mer i kveld. Ikke planlegg hyttetur med argumentet «det skjer sikkert ikke».',kjop:'Sjekk sekk, ladere og snacks. Det er nok handling for i kveld.',kurs:'Ingen nye kurs haster. Kort repetisjon av det dere allerede kan er nok.',bok:'Én jordmor-bok og én ærlig barselbok holder. La bøkene ligge hvis du er lei.'},
39:{baby:'Modningen fortsetter. Talg og lanugo avtar ofte, og fosteret er i stor grad klar. Kroppen er rund og fylt, hodet kan stå dypt, og du merker kanskje mer trykk enn spark. Det er en rolig «ventefase» for begge.',vanlig:'Mye er som i uke 38, pluss mer utålmodighet. Det er en vanlig kombinasjon. Søvn kan være svært brutt. Tyngde, hevelse og følelsen av å være «ferdig» er forståelig. Hold øye med liv — mindre liv skal tas på alvor, også så nær termin.',forvent:'Hvis det drar ut, følger overvåking lokale rutiner. Jordmor og sykehus styrer det — ikke appen. Gå gjerne en rolig tur, ikke intervalltrening, og hold telefonen ladet.',humor:'Humøret svinger med venting. Det er greit å være lei uten å late som du nyter hvert minutt.',partner:'Gå en rolig tur sammen, ikke intervalltrening, og hold telefonen ladet.',kjop:'Kjøp bare det som mangler. Se Lister — impulskjøp hjelper sjelden nå.',kurs:'Ingen kurs haster. Dere har det dere trenger av forberedelse.',bok:'Én jordmor-bok og én ærlig barselbok er nok. Ro og praktisk klarhet slår mer teori.'},
40:{baby:'Dette er den statistiske terminen. Omtrent halvparten er ikke født ennå — og det er forventet. Fosteret er ferdig vokst i det store bildet, men fortsetter små justeringer helt til start. Bevegelse skal fortsatt merkes, selv om plassen er minimal.',vanlig:'Alt og ingenting kan skje. Rier som kommer og dør ut er vanlig. Slitenhet, uro i kroppen og at du speider etter tegn hele tiden er typisk. Du får være lei — lei er ikke det samme som at fødselen er i gang. Si fra ved vannavgang, blødning, sterke rier eller mindre liv.',forvent:'Kontroll og eventuell induksjon diskuteres etter faglige kriterier — ikke etter naboens uke 39. Ingen press om «kjempe-i-gang»-myter. Følg det jordmor faktisk sier.',humor:'Du får være lei. Lei er ikke det samme som at fødselen er i gang.',partner:'Ingen press om «kjempe-i-gang»-myter i kveld. Følg det jordmor faktisk sier.',kjop:'Kjøp bare det som mangler. Se Lister — resten kan vente.',kurs:'Ingen kurs. Praktisk klarhet og ladet telefon er nok.',bok:'Én jordmor-bok og én ærlig barselbok holder. Sykehusets råd veier tyngst nå.'},
41:{baby:'Barnet er fortsatt inne og overvåkes etter sykehusets plan. Modningen fortsetter i det små, mens du og kroppen venter. Fosteret har lite rom, så bevegelser føles ofte som kraftige rull og trykk — fortsatt et viktig tegn på at alt er i gang der inne.',vanlig:'Det er tungt, og søvnen er ofte dårlig. Utålmodighet er vanlig og forståelig. Kroppen kan være hoven, øm og «ferdig». Humøret svinger hardt i overtiden — det er lov å være ferdig med venting uten å skamme seg. Fortsett å kjenne etter liv, og følg sykehusets plan.',forvent:'Tilbud om videre kontroll eller induksjon følger retningslinjer. Dette avgjør fagfolk — ikke appen. Partner: kjør, vent og hent mat. Ikke forklar retningslinjen bedre enn jordmor.',humor:'Humøret svinger hardt i overtiden. Det er lov å være ferdig med venting uten å skamme seg.',partner:'Kjør, vent og hent mat. Ikke forklar retningslinjen bedre enn jordmor gjør.',kjop:'Kjøp bare det som mangler. Se Lister — dere er forbi shoppingfasen.',kurs:'Ingen kurs. Følg sykehusets plan.',bok:'La bøkene ligge. Sykehuset og jordmor har ordet nå.'},
42:{baby:'Det er sjelden å gå hit uten en plan. Forløpet følges tett av sykehuset, og fosteret er allerede klart i det store bildet. Appen har ikke mer å si enn fagfolkene nærmest dere — hold dere til den avtalte planen.',vanlig:'Utmattelse er vanlig. Kroppen og sinnet er ofte slitne av venting. Humøret kan være flatt eller irritert — en ærlig reaksjon på lang ventetid, ikke en karakterdom. Hold dere til den avtalte planen, og ta kontakt ved endring i liv, blødning eller sterke rier.',forvent:'Følg den avtalte planen. Appen har ikke mer å si enn sykehuset i denne fasen. Ingen nye kjøp eller kurs — fagfolkene nærmest dere har prioritet.',humor:'Humøret kan være flatt eller irritert. Det er en ærlig reaksjon på en lang ventetid — ikke en karakterdom.',partner:'Du er logistikk i kveld: kjøring, mat, telefon og ro. Ikke kommentator.',kjop:'Ingen nye kjøp. Det dere trenger, har dere sannsynligvis allerede.',kurs:'Ingen kurs. Følg sykehusets plan uten å overstyre den.',bok:'Ingen mer lesing kreves. Fagfolkene nærmest dere har prioritet.'}

function sumSupplementNutrients(){
  const sum={folate:0,d:0,iodine:0,iron:0,calcium:0,b12:0,dha:0};
  (state.supplements||[]).filter(s=>s.active!==false).forEach(s=>{
    const n=s.nutrients||{};
    Object.keys(sum).forEach(k=>{sum[k]+=(Number(n[k])||0)});
  });
  return sum;
}
function nutrientCoverage(){
  const sum=sumSupplementNutrients();
  return Object.keys(NUTRIENT_TARGETS).map(k=>{
    const meta=NUTRIENT_TARGETS[k];
    const got=sum[k]||0;
    let status="mangler";
    if(meta.target==null) status = got>0 ? "avklar" : "avklar";
    else if(got>=meta.target) status="nok";
    else if(got>0) status="delvis";
    else status="mangler";
    return {key:k, label:meta.label, unit:meta.unit, target:meta.target, got, status, note:meta.note};
  });
}

function encodeProfileTransfer(obj){
  const json=JSON.stringify(obj);
  const b64=btoa(unescape(encodeURIComponent(json))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return b64;
}
function decodeProfileTransfer(b64){
  try{
    const pad=b64.length%4===0?"":"====".slice(b64.length%4);
    const norm=b64.replace(/-/g,"+").replace(/_/g,"/")+pad;
    const json=decodeURIComponent(escape(atob(norm)));
    return JSON.parse(json);
  }catch(e){return null}
}
function buildTransferUrl(){

function saveProfileIdb(slim){
  return openPhotoDb().then(function(db){

      try{
        const tx=db.transaction("photos","readwrite");

          setup:!!slim.setup, nameA:slim.nameA||"", nameB:slim.nameB||"", due:slim.due||"", role:slim.role||"gravid", notes:slim.notes||"", savedAt:Date.now()
        }, "profile");
        tx.oncomplete=function(){resolve()};
        tx.onerror=function(){reject(tx.error)};
      }catch(e){reject(e)}
    });
  });
}
function loadProfileIdb(){
  return openPhotoDb().then(function(db){
    return new Promise(function(resolve,reject){
      try{
        const tx=db.transaction("photos","readonly");
        const req=tx.objectStore("photos").get("profile");
        req.onsuccess=function(){resolve(req.result||null)};
        req.onerror=function(){reject(req.error)};
      }catch(e){reject(e)}
    });
  }).catch(function(){return null});
}

function save(){
  try{
    // Never persist in-memory File/Blob or huge inline photoData in localStorage
    const slim=JSON.parse(JSON.stringify(state, function(k,v){
      if(v && typeof v==="object" && (v instanceof File || v instanceof Blob)) return undefined;
      if(k==="photoData" || k==="_pendingMemFile" || k==="_pendingLifeFile") return undefined;
      return v;
    }));
    const payload=JSON.stringify(slim);
    localStorage.setItem(KEY, payload);
    const check=localStorage.getItem(KEY);

    const parsed=JSON.parse(check);
    if(state.setup && !parsed.setup) throw new Error("setup not persisted");

    try{

function pushSyncNow(){

  if(!ref) return;
  const stripped=stripEphemeral(state);
  const rev=(Number(state.syncRev)||0)+1;
  const updatedAt=Date.now();
  const payload={data:stripped.data, updatedAt:updatedAt, rev:rev};
  _syncOwnWriteUntil=Date.now()+1000;
  ref.set(payload).then(function(){
    state.syncRev=rev;

function applyRemotePayload(remote, opts){
  opts=opts||{};
  if(!remote || !remote.data || typeof remote.data!=="object") return false;
  const updatedAt=Number(remote.updatedAt)||0;
  if(!opts.force && updatedAt && updatedAt<=(_syncLastApplied||state.syncUpdatedAt||0)) return false;
  const localUi={};
  SYNC_LOCAL_KEYS.forEach(function(k){ if(k in state) localUi[k]=state[k]; });
  const keepCfg=state.firebaseConfig;
  const keepCode=state.syncCode;
  const keepEn=state.syncEnabled;
  _syncApplying=true;
  try{
    const d=defaults();
    const incoming=remote.data;
    Object.keys(state).forEach(function(k){
      if(SYNC_LOCAL_KEYS.indexOf(k)>=0) return;
      if(k==="firebaseConfig"||k==="syncCode"||k==="syncEnabled"||k==="syncUpdatedAt"||k==="syncRev") return;
      // leave as-is unless remote has key — full replace of shared fields from remote
    });
    // Replace shared state from remote, keep device UI + sync settings
    const merged=Object.assign({}, d, incoming);
    Object.keys(localUi).forEach(function(k){ merged[k]=localUi[k]; });
    merged.firebaseConfig=keepCfg;
    merged.syncCode=keepCode;
    merged.syncEnabled=keepEn;
    merged.syncUpdatedAt=updatedAt;
    merged.syncRev=Number(remote.rev)||0;
    merged.budget=Object.assign({}, d.budget, incoming.budget||{});
    if(!Array.isArray(merged.budget.income)) merged.budget.income=[];
    if(!Array.isArray(merged.budget.expense)) merged.budget.expense=[];
    ["events","staples","shopList","lifePlan","memories","supplements","logs","kicks","weights","appts","names","contractions","bt","sf","water","meds"].forEach(function(k){
      if(!Array.isArray(merged[k])) merged[k]=Array.isArray(d[k])?d[k]:[];
    });
    if(!merged.shop||typeof merged.shop!=="object") merged.shop={};
    if(!merged.bag||typeof merged.bag!=="object") merged.bag={};
    if(!merged.checks||typeof merged.checks!=="object") merged.checks={};
    if(!merged.vax||typeof merged.vax!=="object") merged.vax={};
    Object.keys(state).forEach(function(k){ delete state[k]; });
    Object.assign(state, merged);
    _syncLastApplied=updatedAt;
    // persist without echoing immediately as "newer" than remote
    const prevIgnore=_syncOwnWriteUntil;
    _syncOwnWriteUntil=Date.now()+1000;
    try{
      const slim=JSON.parse(JSON.stringify(state, function(k,v){
        if(v && typeof v==="object" && (v instanceof File || v instanceof Blob)) return undefined;
        if(k==="photoData" || k==="_pendingMemFile" || k==="_pendingLifeFile") return undefined;
        return v;
      }));
      localStorage.setItem(KEY, JSON.stringify(slim));
      saveProfileIdb(slim).catch(function(){});
    }catch(e){ console.error(e); }
    _syncOwnWriteUntil=Math.max(prevIgnore, Date.now()+800);
    _syncStatusMsg="Hentet fra sky "+new Date(updatedAt).toLocaleTimeString("nb-NO");
    render();
    return true;
  }finally{
    _syncApplying=false;
  }
}
function stopSyncListener(){

function startSyncListener(){

  const ref=familyRef(state.syncCode);
  if(!ref) return;
  const handler=function(snap){
    const remote=snap.val();
    if(!remote) return;
    if(Date.now() < _syncOwnWriteUntil) return;
    const updatedAt=Number(remote.updatedAt)||0;
    if(updatedAt && updatedAt<=(_syncLastApplied||state.syncUpdatedAt||0)) return;
    applyRemotePayload(remote, {force:false});
  };

  _fbUnsub=function(){ ref.off("value", handler); };
}
function createFamilySync(){

function joinFamilySync(rawCode){
  const code=String(rawCode||"").replace(/[^A-Za-z0-9]/g,"").toUpperCase();
  if(code.length<6){ alert("Koden skal være minst 6 tegn (anbefalt 8)."); return; }
  if(!getFirebaseConfig()){ alert("Lim inn Firebase-config først."); return; }
  if(!ensureFirebase()){ alert(_syncStatusMsg||"Firebase er ikke klar."); return; }
  const ref=familyRef(code);
  ref.once("value").then(function(snap){
    const remote=snap.val();
    if(!remote || !remote.data){
      alert("Fant ingen familie med den koden. Sjekk at den andre har opprettet koden først.");
      return;
    }
    const remoteAt=Number(remote.updatedAt)||0;
    const localAt=Number(state.syncUpdatedAt)||0;
    const firstJoin=!state.syncCode;
    if(firstJoin){
      if(!confirm("Erstatt lokal data med familiens sky-data? (Anbefalt første gang du kobler til.)")) return;
      state.syncCode=code;
      state.syncEnabled=true;
      applyRemotePayload(remote, {force:true});
      startSyncListener();
      save();
      return;
    }
    state.syncCode=code;
    state.syncEnabled=true;
    if(remoteAt>=localAt){
      applyRemotePayload(remote, {force:true});
    }else{
      // local newer — push after join
      _syncLastApplied=localAt;
      pushSyncNow();
    }
    startSyncListener();
    save();
    render();
  }).catch(function(e){
    alert("Kunne ikke koble til: "+(e&&e.message?e.message:e));
  });
}

let _idb=null,_idbOk=null,_photoCache={},_pendingMemFile=null,_pendingLifeFile=null;
function openPhotoDb(){
  return new Promise(function(resolve,reject){
    if(_idbOk===false){reject(new Error("idb"));return}
    if(_idb){resolve(_idb);return}
    if(!window.indexedDB){_idbOk=false;reject(new Error("noidb"));return}
    const req=indexedDB.open("familienvaar",1);
    req.onupgradeneeded=function(){const db=req.result;if(!db.objectStoreNames.contains("photos"))db.createObjectStore("photos")};
    req.onsuccess=function(){_idb=req.result;_idbOk=true;resolve(_idb)};
    req.onerror=function(){_idbOk=false;reject(req.error||new Error("idb"))};
  });
}
function putPhoto(key,val){
  return openPhotoDb().then(function(db){
    return new Promise(function(resolve,reject){
      const tx=db.transaction("photos","readwrite");
      tx.objectStore("photos").put(val,key);
      tx.oncomplete=function(){resolve()};
      tx.onerror=function(){reject(tx.error)};
    });
  });
}
function getPhoto(key){
  return openPhotoDb().then(function(db){
    return new Promise(function(resolve,reject){
      const r=db.transaction("photos","readonly").objectStore("photos").get(key);
      r.onsuccess=function(){resolve(r.result||null)};
      r.onerror=function(){reject(r.error)};
    });
  });
}
function delPhoto(key){
  if(!key)return Promise.resolve();
  if(_photoCache[key]&&String(_photoCache[key]).indexOf("blob:")===0){try{URL.revokeObjectURL(_photoCache[key])}catch(e){}}
  delete _photoCache[key];
  return openPhotoDb().then(function(db){
    return new Promise(function(resolve){
      const tx=db.transaction("photos","readwrite");
      tx.objectStore("photos").delete(key);
      tx.oncomplete=function(){resolve()};
      tx.onerror=function(){resolve()};
    });
  }).catch(function(){});
}
function compressImage(file){
  return new Promise(function(resolve,reject){
    const fr=new FileReader();
    fr.onerror=function(){reject(fr.error)};
    fr.onload=function(){
      const img=new Image();
      img.onload=function(){
        let w=img.width,h=img.height;const max=1280;
        if(w>max||h>max){if(w>=h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        c.toBlob(function(b){if(b)resolve(b);else resolve(c.toDataURL("image/jpeg",0.72))},"image/jpeg",0.72);
      };
      img.onerror=function(){reject(new Error("img"))};
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function blobToDataURL(blob){
  return new Promise(function(resolve,reject){
    if(typeof blob==="string"){resolve(blob);return}
    const r=new FileReader();r.onload=function(){resolve(r.result)};r.onerror=reject;r.readAsDataURL(blob);
  });
}
function storeCompressedPhoto(file){

    const key="ph_"+uid();
    return putPhoto(key,compressed).then(function(){
      return {photoKey:key,photoData:null,idb:true};
    }).catch(function(){
      return blobToDataURL(compressed).then(function(dataUrl){
        state._idbLimited=true;

    });
  });
}
function photoSrcFor(key,data){
  if(data)return Promise.resolve(data);
  if(!key)return Promise.resolve(null);
  if(_photoCache[key])return Promise.resolve(_photoCache[key]);
  return getPhoto(key).then(function(blob){
    if(!blob)return null;
    const url=typeof blob==="string"?blob:URL.createObjectURL(blob);
    _photoCache[key]=url;
    return url;
  }).catch(function(){return null});
}

function fmtNOK(n){const x=Number(n)||0;return x.toLocaleString("nb-NO",{minimumFractionDigits:0,maximumFractionDigits:0})+" kr"}
function ymd(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return y+"-"+m+"-"+day}
function addDays(d,n){const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x}
function expandPlanInstances(daysAhead){
  const today=new Date();today.setHours(12,0,0,0);
  const end=addDays(today,daysAhead);
  const out=[];
  (state.events||[]).forEach(e=>{
    if(e.active===false) return;
    const start=parseDate(e.date); if(!start) return;
    const recur=e.recur||"none";
    if(recur==="none"){
      if(start>=today && start<=end) out.push({kind:"event",id:e.id,title:e.title,date:e.date,time:e.time||"",note:e.note||"",recur,active:e.active!==false,src:e});
      return;
    }
    let cur=new Date(start.getTime());
    let guard=0;
    while(cur<today && guard<400){
      if(recur==="daily") cur=addDays(cur,1);
      else if(recur==="daily") cur=addDays(cur,1);
      else if(recur==="weekly") cur=addDays(cur,7);
      else if(recur==="biweekly") cur=addDays(cur,14);
      else if(recur==="monthly"){const n=new Date(cur);n.setMonth(n.getMonth()+1);cur=n}
      else break;
      guard++;
    }
    guard=0;
    while(cur<=end && guard<80){
      if(cur>=today){
        out.push({kind:"event",id:e.id,title:e.title,date:ymd(cur),time:e.time||"",note:e.note||"",recur,active:e.active!==false,src:e,instance:true});
      }
      if(recur==="daily") cur=addDays(cur,1);
      else if(recur==="daily") cur=addDays(cur,1);
      else if(recur==="weekly") cur=addDays(cur,7);
      else if(recur==="biweekly") cur=addDays(cur,14);
      else if(recur==="monthly"){const n=new Date(cur);n.setMonth(n.getMonth()+1);cur=n}
      else break;
      guard++;
    }
  });
  (state.appts||[]).forEach((a,i)=>{
    const d=parseDate(a.date); if(!d) return;
    if(d>=today && d<=end) out.push({kind:"appt",id:"appt-"+i,title:a.title||"Avtale",date:a.date,time:"",note:a.note||"",readonly:true});
  });
  out.sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||""))||String(a.title).localeCompare(String(b.title)));
  return out;
}
function recurLabel(r){return ({none:"Ingen",daily:"Hver dag",weekly:"Hver uke",biweekly:"Annenhver uke",monthly:"Hver måned"})[r]||"Ingen"}
function lifeStatusLabel(s){return ({todo:"Ikke startet",doing:"Pågår",done:"Ferdig"})[s]||s}

function viewPlan(){
  const allowed=["kalender","handle","budsjett","livsplan","tilbakeblikk"];
  let sub=state.planSub||"kalender";
  if(!allowed.includes(sub)){sub="kalender";state.planSub="kalender"}
  const nav=[["kalender","Kalender"],["handle","Handleliste"],["budsjett","Budsjett"],["livsplan","Livsplan"],["tilbakeblikk","Tilbakeblikk"]];
  const pills=nav.map(([id,l])=>`<button class="pill" data-plansub="${id}" style="${sub===id?"background:var(--rose-soft,#f3e2dc);color:var(--ink);border-color:rgba(122,62,69,.22);font-weight:600":""}">${l}</button>`).join("");
  let body="";
  try{
    if(sub==="kalender") body=viewPlanKalender();
    else if(sub==="handle") body=viewPlanHandle();
    else if(sub==="budsjett") body=viewPlanBudsjett();
    else if(sub==="livsplan") body=viewPlanLivsplan();

  }
  return `<header class="app"><div><div class="brand">Plan</div><h1 class="weekbig">Felles oversikt</h1><div class="sub">Kalender, handleliste, budsjett, livsmål og tilbakeblikk — lagret bare her.</div></div></header>

}


function contractionSummary(){
 const today=new Date().toISOString().slice(0,10);
 const list=(state.contractions||[]).filter(c=>c.date===today).map(c=>c.t).sort((a,b)=>a-b);
 if(list.length<2) return list.length?(list.length+" rie i dag"):"Ingen rier logget i dag.";
 const gaps=[]; for(let i=1;i<list.length;i++) gaps.push(Math.round((list[i]-list[i-1])/60000));
 return list.length+" rier i dag. Siste intervall ca. "+gaps[gaps.length-1]+" min. Snitt "+Math.round(gaps.reduce((a,b)=>a+b)/gaps.length)+" min. Appen sier ikke om du skal dra.";
}
